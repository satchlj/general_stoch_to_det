name: Lean verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Lean and restore caches
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Audit public theorems
        run: ./verify.sh
